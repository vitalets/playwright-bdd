name: Question ❓
description: Ask a question about Playwright-BDD usage
title: '[Question]: '
labels: question
body:
  - type: markdown
    attributes:
      value: |
        ## Need help or have a question?

        Tell us what you’re trying to accomplish with playwright-bdd.

  - type: textarea

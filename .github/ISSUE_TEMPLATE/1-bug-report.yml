name: Bug Report 🪲
description: Create a bug report
title: '[Bug]: '
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug!

        A minimal reproduction is required to investigate your bug report.

        **Give your coding agent this prompt** along with your bug description:

        ```text
        Create a minimal reproduction of the bug described below using https://github.com/vitalets/playwright-bdd-example.

        1. Clone the example repository into a new temporary directory outside the current project. Make all reproduction changes in that clone, leaving the current project unchanged.
        2. Follow its README to install dependencies and browsers, then run the existing tests to verify the setup works.
        3. Match the relevant dependency versions and configuration from my bug report or the current project.
        4. Make the smallest changes needed to reproduce the bug.
        5. Run the reproduction and confirm it demonstrates the reported behavior.
        6. Summarize the changes, exact command to reproduce, expected behavior, and actual output.
        7. Once the reproduction is ready, push it to your own public GitHub repository or fork and paste the branch link in **Reproduction Demo URL**.

        Bug description:
        [Describe the bug here]
        ```

  - type: textarea
    id: given
    validations:
      required: true
    attributes:
      label: Given
      description: |
        Provide details about your setup: feature files, step definitions, directory structure, and Playwright configuration.
      placeholder: What is your setup?

  - type: textarea
    id: when
    validations:
      required: true
    attributes:
      label: When
      description: |
        Describe the actions you performed to produce the issue.
      placeholder: What actions did you perform?

  - type: textarea
    id: then
    validations:
      required: true
    attributes:
      label: Then
      description: |
        Provide the **actual** outcome. If there is an error, include the error message, stack trace and screenshots.
      placeholder: What actually happened?

  - type: textarea
    id: expected-result
    validations:
      required: true
    attributes:
      label: Expected Result
      description: |
        Describe the **expected** result.
      placeholder: What did you expect to happen?

  - type: input
    id: reproduction-url
    validations:
      required: true
    attributes:
      label: Reproduction Demo URL
      description: |
        Share a link to your minimal reproduction based on [playwright-bdd-example](https://github.com/vitalets/playwright-bdd-example).
      placeholder: https://github.com/%yourname%/playwright-bdd-example

  - type: textarea
    id: envinfo
    validations:
      required: true
    attributes:
      label: Environment
      description: |
        Please run `npx bddgen env` in the terminal and paste the output here.
      placeholder: |
        Playwright-bdd environment info:

        platform: darwin
        node: v20.11.1
        playwright-bdd: v8.1.0
        @playwright/test: v1.49.1
        @cucumber/cucumber: none
        Playwright config file: playwright.config.ts
      render: shell

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How urgent is this bug for you?
      options:
        - Low
        - Medium
        - High
        - Critical
      default: 1

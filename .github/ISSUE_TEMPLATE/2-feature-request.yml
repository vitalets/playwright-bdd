name: Feature Request 🚀
description: Request a new feature or improvement
title: '[Feature]: '
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for suggesting a new feature!

        Please describe your use case and the behavior you need.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe your use case and the current limitation. Include a concrete example if possible.
      placeholder: I often face the situation when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired Behavior
      description: Describe the behavior you would like. Include an example of the desired usage if possible. You do not need to propose an implementation.
      placeholder: Add an option to the playwright-bdd that...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include your current workaround and any relevant code, screenshots, or links.
